name: Collect Kakao DART and deploy
on:
  workflow_dispatch:
    inputs:
      start_year:
        description: First annual year (empty = last 5 years)
        required: false
        default: ''
      end_year:
        description: Last annual year (empty = previous year)
        required: false
        default: ''
  schedule:
    - cron: '0 0 7 * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: kakao-pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Collect real DART records
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
        run: python scripts/collect.py
      - name: Commit data and originals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data reports index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update Kakao DART annual financials'
            git push
          fi
      - name: Create public dashboard artifact
        run: |
          mkdir -p public
          cp index.html public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
